name: Pre-test (unit)

# Fast gate before anything slow: compiles and runs every test that needs no Docker
# (rule edge cases, golden contract example, controller/contract match, web slices, ArchUnit),
# then PIT mutation testing on the rules. Called by ci.yml; can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Unit, contract, web-slice and architecture tests
        run: ./mvnw -B verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports-jdk${{ matrix.java }}
          path: |
            transferguard-service/target/surefire-reports
            transferguard-simulator/target/surefire-reports

  mutation:
    name: Mutation testing (rules >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - run: ./mvnw -B -pl transferguard-service -am -Pmutation verify -DskipITs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-report
          path: transferguard-service/target/pit-reports
