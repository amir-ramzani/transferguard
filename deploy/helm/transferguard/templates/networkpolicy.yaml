{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller may reach the API and only Prometheus the management port; the app may
# only talk to PostgreSQL, Redis, the OTel collector, DNS and HTTPS (Cognito JWKS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "tg.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    - from: {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
      ports:
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.postgresSelector | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.redisSelector | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.otelNamespace }}
      ports:
        - port: 4318
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
