apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "tg.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "tg.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "tg.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 8081}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          env:
            - name: DB_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: DB_APP_PASSWORD}}
          # Liveness never depends on dependencies; readiness includes PostgreSQL but NOT Redis,
          # because degraded mode handles a Redis outage. Pulling pods would turn a partial outage into a full one.
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 3
            failureThreshold: 40
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "tg.securityContext" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
