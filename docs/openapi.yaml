openapi: 3.1.0
info:
  title: TransferGuard API
  version: 1.0.0
  summary: Real-time scam and mule-account screening for bank transfers.
  description: |
    TransferGuard (codename Pengawal) screens outgoing bank transfers before the money
    leaves the customer's account and returns ALLOW, CHALLENGE or HOLD with
    human-readable reasons.

    **Authentication.** Every endpoint needs an OAuth2 access token (JWT). Scopes use
    the Cognito resource-server format `transferguard/<scope>`. Locally, a mock OAuth2
    server issues tokens with the same scopes; in AWS, Amazon Cognito does.

    **Money.** Amounts are decimal strings with exactly two decimal places
    (for example `"4800.00"`) so no client ever parses money as a binary float.

    **Errors.** All errors use RFC 9457 problem details (`application/problem+json`).
  contact:
    name: TransferGuard maintainers
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Local (Docker Compose)
  - url: https://{host}/api/v1
    description: AWS deployment
    variables:
      host:
        default: transferguard.example.com

security:
  - oauth2: []

tags:
  - name: Screening
    description: Screen outgoing transfers and report what happened to them.
  - name: Events
    description: Signals from the bank that feed the mule and device rules.
  - name: Cases
    description: Analyst queue for held transfers.
  - name: Rules
    description: View and tune detection rules and decision bands.
  - name: Watchlist
    description: Reported mule accounts.
  - name: Audit
    description: Tamper-evident audit trail.

paths:
  /screenings:
    post:
      tags: [Screening]
      operationId: screenTransfer
      summary: Screen an outgoing transfer
      description: |
        Scores the transfer against all enabled rules and returns a decision.
        Idempotent on `transactionId` for 24 hours: repeating the same request returns
        the stored screening with `200` and `Idempotent-Replay: true`. Reusing a
        `transactionId` with a different body returns `422`.
      security:
        - oauth2: [transferguard/screening.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningRequest'
            examples:
              takeover:
                summary: Large transfer to a new payee at 01:42 from a new device
                value:
                  transactionId: TXN-20261119-000123
                  sourceAccount: 1402-0012-3456
                  payeeAccount: 1402-0098-7654
                  amount: '4800.00'
                  currency: MYR
                  channel: MOBILE
                  deviceId: dev-7f3a
                  requestedAt: '2026-11-19T01:42:10+08:00'
      responses:
        '201':
          description: Screened for the first time.
          headers:
            Location:
              description: URL of the stored screening.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningResponse'
              examples:
                hold:
                  $ref: '#/components/examples/HoldResponse'
        '200':
          description: Replay of an earlier screening with the same `transactionId` and body.
          headers:
            Idempotent-Replay:
              description: Always `true` on a replay.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The same `transactionId` is being screened right now. Retry after the given delay.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The `transactionId` was already used with a different request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /screenings/{screeningId}:
    get:
      tags: [Screening]
      operationId: getScreening
      summary: Fetch a past screening with its reasons
      security:
        - oauth2: [transferguard/screening.read]
      parameters:
        - $ref: '#/components/parameters/ScreeningId'
      responses:
        '200':
          description: The screening.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /screenings/{screeningId}/outcome:
    post:
      tags: [Screening]
      operationId: recordOutcome
      summary: Report what happened to a screened transfer
      description: |
        Tells TransferGuard whether the transfer actually went through. Only
        `COMPLETED` transfers update the customer's known payees, 30-day profile and
        outbound totals. Idempotent: sending the same outcome again returns `204`;
        changing a recorded outcome returns `409`.
      security:
        - oauth2: [transferguard/screening.write]
      parameters:
        - $ref: '#/components/parameters/ScreeningId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeRequest'
      responses:
        '204':
          description: Outcome recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /events/inbound-credits:
    post:
      tags: [Events]
      operationId: recordInboundCredit
      summary: Record an incoming credit (feeds R5_PASS_THROUGH)
      description: Idempotent on `creditId`.
      security:
        - oauth2: [transferguard/events.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboundCreditEvent'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/security:
    post:
      tags: [Events]
      operationId: recordSecurityEvent
      summary: Record a device change or password reset (feeds R6_NEW_DEVICE)
      security:
        - oauth2: [transferguard/events.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityEvent'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: Analyst case queue
      security:
        - oauth2: [transferguard/cases.read]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CaseStatus'
        - name: assignee
          in: query
          description: Subject (`sub`) of the assigned analyst.
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of cases, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      operationId: getCase
      summary: Fetch a case with its screening and notes
      security:
        - oauth2: [transferguard/cases.read]
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Cases]
      operationId: updateCase
      summary: Assign or resolve a case
      description: |
        Set `assignee` to take a case. Set `status` to `CONFIRMED_FRAUD` or
        `FALSE_POSITIVE` to resolve it; `resolutionNote` is then required. Resolution
        is final: updating a resolved case returns `409`. Every change is written to
        the audit log.
      security:
        - oauth2: [transferguard/cases.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdate'
      responses:
        '200':
          description: The updated case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Case'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /cases/{caseId}/notes:
    post:
      tags: [Cases]
      operationId: addCaseNote
      summary: Add a note to a case
      security:
        - oauth2: [transferguard/cases.write]
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseNoteRequest'
      responses:
        '201':
          description: Note added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rules:
    get:
      tags: [Rules]
      operationId: listRules
      summary: List all rules
      security:
        - oauth2: [transferguard/rules.admin]
      responses:
        '200':
          description: All rules, in code order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rules/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RuleCode'
    get:
      tags: [Rules]
      operationId: getRule
      summary: View a rule
      security:
        - oauth2: [transferguard/rules.admin]
      responses:
        '200':
          description: The rule. The `ETag` header carries its version for `If-Match`.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Rules]
      operationId: updateRule
      summary: Tune a rule
      description: |
        Replaces the rule's `enabled`, `weight` and `params`. `params` must match the
        rule's own parameter schema. Requires `If-Match` with the current `ETag` so two
        analysts can't overwrite each other. Takes effect in every pod within 60 seconds
        and is written to the audit log.
      security:
        - oauth2: [transferguard/rules.admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdate'
            examples:
              velocity:
                summary: Widen the velocity window to 15 minutes
                value:
                  enabled: true
                  weight: 30
                  params:
                    maxCount: 5
                    window: PT15M
      responses:
        '200':
          description: The updated rule.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /settings/engine:
    get:
      tags: [Rules]
      operationId: getEngineSettings
      summary: View decision bands and the fail mode
      security:
        - oauth2: [transferguard/rules.admin]
      responses:
        '200':
          description: Current settings.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Rules]
      operationId: updateEngineSettings
      summary: Change decision bands or the fail mode
      security:
        - oauth2: [transferguard/rules.admin]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EngineSettings'
      responses:
        '200':
          description: The updated settings.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /watchlist:
    get:
      tags: [Watchlist]
      operationId: listWatchlist
      summary: List reported mule accounts
      security:
        - oauth2: [transferguard/rules.admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of entries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /watchlist/{accountNo}:
    parameters:
      - name: accountNo
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AccountNumber'
    put:
      tags: [Watchlist]
      operationId: addToWatchlist
      summary: Add or update a reported mule account
      description: Idempotent. Written to the audit log.
      security:
        - oauth2: [transferguard/rules.admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistEntryRequest'
      responses:
        '200':
          description: Entry updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntry'
        '201':
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Watchlist]
      operationId: removeFromWatchlist
      summary: Remove an account from the watchlist
      description: Written to the audit log.
      security:
        - oauth2: [transferguard/rules.admin]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /audit:
    get:
      tags: [Audit]
      operationId: listAuditEntries
      summary: List audit entries, newest first
      security:
        - oauth2: [transferguard/audit.read]
      parameters:
        - name: entity
          in: query
          description: Filter by entity, for example `rule:R1_VELOCITY` or `case:CASE-000041`.
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /audit/verify:
    get:
      tags: [Audit]
      operationId: verifyAuditChain
      summary: Recompute the audit hash chain
      security:
        - oauth2: [transferguard/audit.read]
      responses:
        '200':
          description: The result of the check. A broken chain is still a `200`; read `valid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        Locally the mock OAuth2 server at `http://localhost:8090/transferguard` issues
        tokens for any client ID and secret. In AWS, use the Cognito domain's
        `/oauth2/token` and `/oauth2/authorize` endpoints instead.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8090/transferguard/token
          scopes:
            transferguard/screening.write: Screen transfers and report outcomes
            transferguard/screening.read: Read past screenings
            transferguard/events.write: Send inbound-credit and security events
            transferguard/cases.read: Read the case queue
            transferguard/cases.write: Assign, resolve and annotate cases
            transferguard/rules.admin: Tune rules, settings and the watchlist
            transferguard/audit.read: Read and verify the audit log
        authorizationCode:
          authorizationUrl: http://localhost:8090/transferguard/authorize
          tokenUrl: http://localhost:8090/transferguard/token
          scopes:
            transferguard/screening.read: Read past screenings
            transferguard/cases.read: Read the case queue
            transferguard/cases.write: Assign, resolve and annotate cases
            transferguard/rules.admin: Tune rules, settings and the watchlist
            transferguard/audit.read: Read and verify the audit log

  parameters:
    ScreeningId:
      name: screeningId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CaseId'
    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` from the last read. Prevents lost updates.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request failed validation. `errors` lists each invalid field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, expired or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token lacks the required scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The change conflicts with the resource's current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: '`If-Match` does not match the current version. Read again and retry.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: '`If-Match` header is missing.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit for this client exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: |
        A required dependency (PostgreSQL) is unavailable, so no decision can be
        recorded. The caller applies its own fallback.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  examples:
    HoldResponse:
      summary: HOLD with four reasons (25 + 25 + 20 + 10 = 80), highest points first
      value:
        screeningId: 4b2e9c7a-1f0d-4c2b-9a8e-2f6d1c3b5a90
        transactionId: TXN-20261119-000123
        decision: HOLD
        score: 80
        degraded: false
        reasons:
          - code: R2_NEW_PAYEE_HIGH_AMOUNT
            points: 25
            message: First transfer to this payee is RM 4,800
          - code: R3_AMOUNT_ANOMALY
            points: 25
            message: Amount is 8x the 30-day average
          - code: R6_NEW_DEVICE
            points: 20
            message: New device seen 12 minutes before this transfer
          - code: R4_ODD_HOURS
            points: 10
            message: Transfer requested at 01:42
        caseId: CASE-000041
        screenedAt: '2026-11-19T01:42:10.184+08:00'

  schemas:
    AccountNumber:
      type: string
      pattern: '^[0-9]{4}-[0-9]{4}-[0-9]{4,8}$'
      examples: ['1402-0012-3456']
    Money:
      type: string
      description: Decimal amount with exactly two decimal places.
      pattern: '^(0|[1-9][0-9]{0,12})\.[0-9]{2}$'
      examples: ['4800.00']
    Currency:
      type: string
      enum: [MYR]
    Channel:
      type: string
      enum: [MOBILE, INTERNET_BANKING, BRANCH, API]
    Decision:
      type: string
      enum: [ALLOW, CHALLENGE, HOLD]
    RuleCode:
      type: string
      enum:
        - R1_VELOCITY
        - R2_NEW_PAYEE_HIGH_AMOUNT
        - R3_AMOUNT_ANOMALY
        - R4_ODD_HOURS
        - R5_PASS_THROUGH
        - R6_NEW_DEVICE
        - R7_WATCHLIST
    ReasonCode:
      description: A rule code, or `DEGRADED_SCREENING` when some rules could not run.
      oneOf:
        - $ref: '#/components/schemas/RuleCode'
        - type: string
          const: DEGRADED_SCREENING
    CaseId:
      type: string
      pattern: '^CASE-[0-9]{6,}$'
      examples: ['CASE-000041']
    CaseStatus:
      type: string
      enum: [OPEN, CONFIRMED_FRAUD, FALSE_POSITIVE]

    ScreeningRequest:
      type: object
      additionalProperties: false
      required: [transactionId, sourceAccount, payeeAccount, amount, currency, channel, requestedAt]
      properties:
        transactionId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9-]+$'
          description: The bank's unique ID for this transfer. Idempotency key.
        sourceAccount:
          $ref: '#/components/schemas/AccountNumber'
        payeeAccount:
          $ref: '#/components/schemas/AccountNumber'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        channel:
          $ref: '#/components/schemas/Channel'
        deviceId:
          type: string
          maxLength: 128
          description: Device fingerprint from the bank's app. Optional for branch transfers.
        requestedAt:
          type: string
          format: date-time
          description: When the customer submitted the transfer. Rejected if more than 5 minutes from server time.

    Reason:
      type: object
      required: [code, points, message]
      properties:
        code:
          $ref: '#/components/schemas/ReasonCode'
        points:
          type: integer
          minimum: 0
        message:
          type: string

    ScreeningResponse:
      type: object
      required: [screeningId, transactionId, decision, score, degraded, reasons, screenedAt]
      properties:
        screeningId:
          type: string
          format: uuid
        transactionId:
          type: string
        decision:
          $ref: '#/components/schemas/Decision'
        score:
          type: integer
          minimum: 0
        degraded:
          type: boolean
          description: True when Redis was unavailable and only some rules ran.
        reasons:
          type: array
          description: Every rule that fired, highest points first (ties in rule-code order).
          items:
            $ref: '#/components/schemas/Reason'
        caseId:
          description: Present only when the decision is HOLD.
          $ref: '#/components/schemas/CaseId'
        screenedAt:
          type: string
          format: date-time

    ScreeningDetail:
      allOf:
        - $ref: '#/components/schemas/ScreeningResponse'
        - type: object
          required: [request]
          properties:
            request:
              $ref: '#/components/schemas/ScreeningRequest'
            outcome:
              $ref: '#/components/schemas/TransferOutcome'
            outcomeAt:
              type: string
              format: date-time

    TransferOutcome:
      type: string
      enum: [COMPLETED, CHALLENGE_FAILED, CANCELLED]

    OutcomeRequest:
      type: object
      additionalProperties: false
      required: [outcome, occurredAt]
      properties:
        outcome:
          $ref: '#/components/schemas/TransferOutcome'
        occurredAt:
          type: string
          format: date-time

    InboundCreditEvent:
      type: object
      additionalProperties: false
      required: [creditId, account, senderAccount, amount, currency, receivedAt]
      properties:
        creditId:
          type: string
          minLength: 1
          maxLength: 64
          description: The bank's unique ID for this credit. Idempotency key.
        account:
          $ref: '#/components/schemas/AccountNumber'
        senderAccount:
          type: string
          minLength: 1
          maxLength: 34
          description: Sender's account or IBAN. May belong to another bank.
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        receivedAt:
          type: string
          format: date-time

    SecurityEvent:
      type: object
      additionalProperties: false
      required: [eventId, account, type, occurredAt]
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 64
        account:
          $ref: '#/components/schemas/AccountNumber'
        type:
          type: string
          enum: [DEVICE_CHANGED, PASSWORD_RESET]
        deviceId:
          type: string
          maxLength: 128
          description: Required when `type` is `DEVICE_CHANGED`.
        occurredAt:
          type: string
          format: date-time
      if:
        properties:
          type:
            const: DEVICE_CHANGED
      then:
        required: [deviceId]
        properties:
          deviceId:
            type: string
            minLength: 1

    Case:
      type: object
      required: [caseId, screeningId, status, createdAt]
      properties:
        caseId:
          $ref: '#/components/schemas/CaseId'
        screeningId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CaseStatus'
        assignee:
          type: [string, 'null']
        score:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time

    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/Case'
        - type: object
          required: [screening, notes]
          properties:
            screening:
              $ref: '#/components/schemas/ScreeningDetail'
            notes:
              type: array
              items:
                $ref: '#/components/schemas/CaseNote'

    CaseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        assignee:
          type: string
          maxLength: 128
        status:
          type: string
          enum: [CONFIRMED_FRAUD, FALSE_POSITIVE]
        resolutionNote:
          type: string
          minLength: 1
          maxLength: 2000
        addPayeeToWatchlist:
          type: boolean
          default: false
          description: Only with `CONFIRMED_FRAUD`. Adds the payee to the watchlist in the same transaction.
      dependentRequired:
        status: [resolutionNote]

    CaseNoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000

    CaseNote:
      type: object
      required: [noteId, author, note, createdAt]
      properties:
        noteId:
          type: integer
          format: int64
        author:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    CasePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Case'

    Rule:
      type: object
      required: [code, name, enabled, weight, params, version, updatedAt, updatedBy]
      properties:
        code:
          $ref: '#/components/schemas/RuleCode'
        name:
          type: string
        enabled:
          type: boolean
        weight:
          type: integer
          minimum: 0
          maximum: 100
        params:
          $ref: '#/components/schemas/RuleParams'
        version:
          type: integer
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    RuleUpdate:
      type: object
      additionalProperties: false
      required: [enabled, weight, params]
      properties:
        enabled:
          type: boolean
        weight:
          type: integer
          minimum: 0
          maximum: 100
        params:
          $ref: '#/components/schemas/RuleParams'

    RuleParams:
      description: Parameters for one rule. The server checks them against the rule named in the path.
      oneOf:
        - $ref: '#/components/schemas/VelocityParams'
        - $ref: '#/components/schemas/NewPayeeParams'
        - $ref: '#/components/schemas/AmountAnomalyParams'
        - $ref: '#/components/schemas/OddHoursParams'
        - $ref: '#/components/schemas/PassThroughParams'
        - $ref: '#/components/schemas/NewDeviceParams'
        - $ref: '#/components/schemas/WatchlistParams'

    VelocityParams:
      title: R1_VELOCITY
      type: object
      additionalProperties: false
      required: [maxCount, window]
      properties:
        maxCount:
          type: integer
          minimum: 1
        window:
          type: string
          format: duration
          examples: [PT10M]

    NewPayeeParams:
      title: R2_NEW_PAYEE_HIGH_AMOUNT
      type: object
      additionalProperties: false
      required: [minAmount]
      properties:
        minAmount:
          $ref: '#/components/schemas/Money'

    AmountAnomalyParams:
      title: R3_AMOUNT_ANOMALY
      type: object
      additionalProperties: false
      required: [multiplier, minHistory]
      properties:
        multiplier:
          type: number
          exclusiveMinimum: 1
        minHistory:
          type: integer
          minimum: 1

    OddHoursParams:
      title: R4_ODD_HOURS
      type: object
      additionalProperties: false
      required: [start, end, minAmount, zone]
      properties:
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        minAmount:
          $ref: '#/components/schemas/Money'
        zone:
          type: string
          examples: [Asia/Kuala_Lumpur]

    PassThroughParams:
      title: R5_PASS_THROUGH
      type: object
      additionalProperties: false
      required: [window, minSenders, outRatio]
      properties:
        window:
          type: string
          format: duration
        minSenders:
          type: integer
          minimum: 2
        outRatio:
          type: number
          exclusiveMinimum: 0
          maximum: 1

    NewDeviceParams:
      title: R6_NEW_DEVICE
      type: object
      additionalProperties: false
      required: [window]
      properties:
        window:
          type: string
          format: duration

    WatchlistParams:
      title: R7_WATCHLIST
      type: object
      additionalProperties: false
      maxProperties: 0

    EngineSettings:
      type: object
      additionalProperties: false
      required: [allowMax, challengeMax, failMode]
      description: Scores up to `allowMax` ALLOW; up to `challengeMax` CHALLENGE; above that HOLD.
      properties:
        allowMax:
          type: integer
          minimum: 0
          examples: [39]
        challengeMax:
          type: integer
          minimum: 1
          examples: [69]
        failMode:
          type: string
          enum: [OPEN, DEGRADED, CLOSED]
          description: Behaviour when Redis is unavailable.
        degradedChallengeMinAmount:
          $ref: '#/components/schemas/Money'
          description: In DEGRADED mode, transfers at or above this amount are at least CHALLENGE.

    WatchlistEntryRequest:
      type: object
      additionalProperties: false
      required: [source, reason]
      properties:
        source:
          type: string
          enum: [CASE, POLICE_REPORT, NFCC, BNM, OTHER_BANK, MANUAL]
          description: Where the report came from.
        reason:
          type: string
          minLength: 1
          maxLength: 500
        caseId:
          $ref: '#/components/schemas/CaseId'

    WatchlistEntry:
      allOf:
        - $ref: '#/components/schemas/WatchlistEntryRequest'
        - type: object
          required: [accountNo, addedAt, addedBy]
          properties:
            accountNo:
              $ref: '#/components/schemas/AccountNumber'
            addedAt:
              type: string
              format: date-time
            addedBy:
              type: string

    WatchlistPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/WatchlistEntry'

    AuditEntry:
      type: object
      required: [id, actor, action, entity, prevHash, hash, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
          examples: [RULE_UPDATED]
        entity:
          type: string
          examples: ['rule:R1_VELOCITY']
        before:
          type: [object, 'null']
        after:
          type: [object, 'null']
        prevHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        createdAt:
          type: string
          format: date-time

    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditEntry'

    AuditVerifyResult:
      type: object
      required: [valid, entriesChecked, checkedAt]
      properties:
        valid:
          type: boolean
        entriesChecked:
          type: integer
          format: int64
        firstBrokenId:
          type: [integer, 'null']
          format: int64
          description: ID of the first row whose hash does not match. Null when valid.
        headHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        checkedAt:
          type: string
          format: date-time

    PageInfo:
      type: object
      required: [page, size, totalItems]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ['https://transferguard.dev/problems/validation']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        traceId:
          type: string
          description: OpenTelemetry trace ID, for support.
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
